<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rex-tg</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --code: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --add: rgba(46, 160, 67, 0.18);
    --del: rgba(248, 81, 73, 0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 16px 32px; background: var(--bg); color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow-wrap: anywhere;
  }
  h1.title { font-size: 18px; margin: 4px 0 12px; }
  a { color: var(--link); }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 8px 0; }
  th, td { border: 1px solid color-mix(in srgb, var(--hint) 40%, transparent); padding: 4px 8px; text-align: left; vertical-align: top; }
  blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--hint); color: var(--hint); }
  .diff { font: 12px/1.5 ui-monospace, Menlo, monospace; }
  .diff .file { margin: 0 0 16px; border: 1px solid color-mix(in srgb, var(--hint) 35%, transparent); border-radius: 8px; overflow-x: auto; }
  .diff .name { font-weight: 600; padding: 6px 10px; background: var(--code); position: sticky; left: 0; }
  .diff .file > div:not(.name) { white-space: pre; padding: 0 10px; min-width: max-content; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }
  .diff .hunk, .diff .meta { color: var(--hint); }
  .note { color: var(--hint); }
</style>
</head>
<body>
<h1 class="title" id="title">rex-tg</h1>
<div id="page" class="note">Loading…</div>
<script src="app.js"></script>
</body>
</html>
