<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rex-tg</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Sizes are in rem: A− and A+ change the root size (--scale), and all
     text follows. */
  :root {
    --scale: 1;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --code: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --add: rgba(46, 160, 67, 0.18);
    --del: rgba(248, 81, 73, 0.18);
    font-size: calc(16px * var(--scale));
    /* iOS makes the text of wide blocks (a diff, a screen) bigger; this
       keeps every size as it is set. */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  /* The ☀/🌙 button sets a theme of its own over Telegram's. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --fg: #1b1b1f; --hint: #707579; --link: #2481cc; --code: #f2f2f5;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17212b; --fg: #f5f5f5; --hint: #8b98a5; --link: #62bcf9; --code: #232e3c;
    --add: rgba(46, 160, 67, 0.28);
    --del: rgba(248, 81, 73, 0.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 32px; background: var(--bg); color: var(--fg);
    font: 1rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow-wrap: anywhere;
  }
  /* the top bar: the title, the text size, and the theme. The bar's own
     sizes are in px: they do not grow with the text. */
  .top {
    position: sticky; top: 0; z-index: 3; background: var(--bg);
    display: flex; align-items: center; gap: 10px; padding: 10px 0 9px; margin: 0 0 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--hint) 18%, transparent);
  }
  h1.title {
    flex: 1; min-width: 0; font-size: 17px; line-height: 1.3; margin: 0; font-weight: 650;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .tools { display: flex; align-items: center; gap: 8px; flex: none; }
  .tools button {
    font: 600 14px/1 -apple-system, system-ui, sans-serif; color: var(--fg);
    background: none; border: none; padding: 0; margin: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .seg {
    display: flex; align-items: stretch; height: 34px; border-radius: 17px; overflow: hidden;
    background: var(--code); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hint) 18%, transparent);
  }
  .seg button { min-width: 38px; padding: 0 10px; display: flex; align-items: center; justify-content: center; }
  .seg button + button { border-left: 1px solid color-mix(in srgb, var(--hint) 22%, transparent); }
  .seg #smaller { font-size: 12px; }
  .seg #bigger { font-size: 16px; }
  .seg #reset { font-size: 12px; min-width: 46px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .tools button.icon {
    width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center;
    background: var(--code); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hint) 18%, transparent);
  }
  .tools button.icon svg { width: 18px; height: 18px; }
  .tools button:active { opacity: 0.55; }
  a { color: var(--link); }
  code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 0.8125rem; }
  code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; margin: 8px 0; }
  th, td { border: 1px solid color-mix(in srgb, var(--hint) 40%, transparent); padding: 4px 8px; text-align: left; vertical-align: top; }
  blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--hint); color: var(--hint); }
  .diff { font: 0.75rem/1.5 ui-monospace, Menlo, monospace; }
  .diff .file { margin: 0 0 16px; border: 1px solid color-mix(in srgb, var(--hint) 35%, transparent); border-radius: 8px; overflow-x: auto; }
  .diff .name { font-weight: 600; padding: 6px 10px; background: var(--code); position: sticky; left: 0; }
  .diff .file > div:not(.name) { white-space: pre; padding: 0 10px; min-width: max-content; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }
  .diff .hunk, .diff .meta { color: var(--hint); }
  .note { color: var(--hint); }
  /* the live screen: it fills the height of the phone, below the bars */
  body.fill { height: var(--tg-viewport-stable-height, 100dvh); display: flex; flex-direction: column; padding-bottom: 10px; overflow: hidden; }
  body.fill #page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; font: 13px/1.2 -apple-system, system-ui, sans-serif; }
  .status { color: var(--hint); font-variant-numeric: tabular-nums; }
  .status.live { color: #2ea043; }
  .chips { display: flex; gap: 6px; }
  .chip {
    font: 600 13px/1 -apple-system, system-ui, sans-serif; color: var(--fg); height: 30px; padding: 0 12px;
    border-radius: 15px; border: none; background: var(--code); -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hint) 18%, transparent);
  }
  .chip.on { background: var(--link); color: #fff; box-shadow: none; }
  .chip:active { opacity: 0.55; }
  .term-wrap {
    position: relative; flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    background: #1e1e1e; border-radius: 10px; padding: 8px;
  }
  /* Short output sits at the bottom, like a terminal; long output scrolls. */
  .term-wrap { display: flex; flex-direction: column; }
  .term-wrap > .xterm, .term-wrap > pre.screen { margin-top: auto; flex: none; }
  .term-wrap .xterm { padding: 0; }
  .term-wrap .xterm-viewport { overflow: hidden !important; background: transparent !important; }
  pre.screen { margin: 0; padding: 0; background: none; color: #d4d4d4; font-size: 0.6875rem; line-height: 1.2; white-space: pre; }
  .jump {
    position: absolute; right: 26px; bottom: 26px; z-index: 2; width: 40px; height: 40px; border-radius: 20px;
    border: none; background: var(--link); color: #fff; font: 600 20px/1 -apple-system, system-ui, sans-serif;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .jump[hidden] { display: none; }
  /* the file browser */
  .crumbs { font-size: 0.875rem; margin: 0 0 10px; overflow-wrap: anywhere; }
  .crumbs a { text-decoration: none; }
  .crumbs .sep { color: var(--hint); }
  .files { display: flex; flex-direction: column; }
  .entry { display: flex; align-items: center; gap: 8px; padding: 9px 2px; color: var(--fg); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--hint) 20%, transparent); }
  .entry .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entry.dir .name { font-weight: 600; }
  .entry .size { color: var(--hint); font-size: 0.8125rem; white-space: nowrap; }
  .content pre.code { white-space: pre; font-size: 0.75rem; tab-size: 4; }
  .content img.image { max-width: 100%; height: auto; }
</style>
</head>
<body>
<header class="top">
  <h1 class="title" id="title">rex-tg</h1>
  <div class="tools">
    <div class="seg" role="group" aria-label="Text size">
      <button type="button" id="smaller" aria-label="Smaller text">A−</button>
      <button type="button" id="reset" aria-label="Normal text size">100%</button>
      <button type="button" id="bigger" aria-label="Bigger text">A+</button>
    </div>
    <button type="button" class="icon" id="theme" aria-label="Light or dark"></button>
  </div>
</header>
<div id="page" class="note">Loading…</div>
<script src="app.js"></script>
</body>
</html>
